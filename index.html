<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse — Analytics Dashboard</title>
    <meta name="description" content="Pulse is an analytics dashboard demo for a fictional online store: KPIs, charts, orders and products. Built with React, Vite and Recharts." />
    <meta name="theme-color" content="#256abf" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Open Graph: the title, text and picture that social sites show when someone shares the link. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pulse — Analytics Dashboard" />
    <meta property="og:description" content="An analytics dashboard demo for a fictional online store, with generated data. Built with React, Vite and Recharts." />
    <meta property="og:image" content="https://pulse-analytics-dashboard-dun.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Pulse overview page with KPI cards and a revenue chart" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Choose the theme before the page is drawn, so dark mode users never see a white flash.
      // React reads the same saved setting later (src/settings/storage.js).
      try {
        var saved = JSON.parse(localStorage.getItem('pulse-settings') || '{}') || {}
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = saved.theme === 'dark' || saved.theme === 'light' ? saved.theme : prefersDark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
